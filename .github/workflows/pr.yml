name: PR Review

on:
  pull_request:
    branches: [main, v2]

jobs:
  plan-guard:
    name: Plan Guard
    if: github.base_ref == 'v2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history, so the ancestor check can see every plan commit on v2
          fetch-depth: 0

      - name: Check the PR follows the plan on v2
        run: ./scripts/ci/plan-guard.sh "$HEAD_BRANCH" "$HEAD_SHA" origin/v2
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  test:
    name: Unit and Browser Tests
    runs-on: ubuntu-latest
    needs: build
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
      # required for playwright to run as root in Firefox
      options: --user root
    env:
      # required for playwright to run as root in Firefox
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run browser tests
        run: npm run test:browser

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
      # required for playwright to run as root in Firefox
      options: --user root
    env:
      # required for playwright to run as root in Firefox
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Disable typewriter animation to avoid timing issues in E2E tests
          VITE_TYPEWRITER_SPEED: "0"

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
          # Disable typewriter animation to avoid timing issues in E2E tests
          VITE_TYPEWRITER_SPEED: "0"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 1
